naftiko: "1.0.0-alpha1"

info:
  label: "Azure DevOps Pipelines API"
  description: "REST endpoints for managing CI/CD build and release pipelines, triggering builds, and retrieving build results."
  tags:
    - Azure DevOps
    - Pipelines
    - CI/CD
    - Build
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      AZURE_DEVOPS_PAT: AZURE_DEVOPS_PAT

capability:
  consumes:
    - type: http
      namespace: azure-devops-pipelines
      baseUri: https://dev.azure.com/{organization}
      description: "Azure DevOps Pipelines API for CI/CD pipeline management."
      authentication:
        type: basic
        username: ""
        password: "{{AZURE_DEVOPS_PAT}}"
      resources:
        - name: pipelines
          path: /{project}/_apis/pipelines
          description: "Pipeline definition and run management."
          operations:
            - name: list-pipelines
              method: GET
              description: "List all pipelines in the project."
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name or ID"
                - name: $orderBy
                  in: query
                  type: string
                  required: false
                  description: "Order results"
                - name: $top
                  in: query
                  type: integer
                  required: false
                  description: "Number of results"
                - name: continuationToken
                  in: query
                  type: string
                  required: false
                  description: "Pagination token"
                - name: api-version
                  in: query
                  type: string
                  required: true
                  description: "API version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-pipeline
              method: POST
              description: "Creates a new pipeline from a YAML definition."
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name or ID"
                - name: api-version
                  in: query
                  type: string
                  required: true
                  description: "API version"
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  folder: "{{tools.folder}}"
                  configuration: "{{tools.configuration}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-pipeline
              method: GET
              description: "Get a specific pipeline by ID."
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name or ID"
                - name: pipelineId
                  in: path
                  type: integer
                  required: true
                  description: "Pipeline ID"
                - name: api-version
                  in: query
                  type: string
                  required: true
                  description: "API version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: list-pipeline-runs
              method: GET
              description: "List runs for a specific pipeline."
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name or ID"
                - name: pipelineId
                  in: path
                  type: integer
                  required: true
                  description: "Pipeline ID"
                - name: api-version
                  in: query
                  type: string
                  required: true
                  description: "API version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: run-pipeline
              method: POST
              description: "Triggers a new run of the specified pipeline."
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name or ID"
                - name: pipelineId
                  in: path
                  type: integer
                  required: true
                  description: "Pipeline ID"
                - name: api-version
                  in: query
                  type: string
                  required: true
                  description: "API version"
              body:
                type: json
                data:
                  resources: "{{tools.resources}}"
                  variables: "{{tools.variables}}"
                  templateParameters: "{{tools.templateParameters}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-pipeline-run
              method: GET
              description: "Get the details of a specific pipeline run."
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name or ID"
                - name: pipelineId
                  in: path
                  type: integer
                  required: true
                  description: "Pipeline ID"
                - name: runId
                  in: path
                  type: integer
                  required: true
                  description: "Run ID"
                - name: api-version
                  in: query
                  type: string
                  required: true
                  description: "API version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: pipelines-api
      resources:
        - path: /v1/pipelines
          name: pipelines
          description: "Pipeline definitions"
          operations:
            - method: GET
              name: list-pipelines
              description: "List all pipelines"
              call: "azure-devops-pipelines.list-pipelines"
              with:
                project: "rest.project"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-pipeline
              description: "Create a pipeline"
              call: "azure-devops-pipelines.create-pipeline"
              with:
                project: "rest.project"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/pipelines/{pipelineId}
          name: pipeline
          description: "Single pipeline"
          operations:
            - method: GET
              name: get-pipeline
              description: "Get a pipeline by ID"
              call: "azure-devops-pipelines.get-pipeline"
              with:
                project: "rest.project"
                pipelineId: "rest.pipelineId"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/pipelines/{pipelineId}/runs
          name: pipeline-runs
          description: "Pipeline runs"
          operations:
            - method: GET
              name: list-pipeline-runs
              description: "List pipeline runs"
              call: "azure-devops-pipelines.list-pipeline-runs"
              with:
                project: "rest.project"
                pipelineId: "rest.pipelineId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: run-pipeline
              description: "Trigger a pipeline run"
              call: "azure-devops-pipelines.run-pipeline"
              with:
                project: "rest.project"
                pipelineId: "rest.pipelineId"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/pipelines/{pipelineId}/runs/{runId}
          name: pipeline-run
          description: "Single pipeline run"
          operations:
            - method: GET
              name: get-pipeline-run
              description: "Get a pipeline run"
              call: "azure-devops-pipelines.get-pipeline-run"
              with:
                project: "rest.project"
                pipelineId: "rest.pipelineId"
                runId: "rest.runId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: pipelines-mcp
      transport: http
      tools:
        - name: list-pipelines
          description: "List all pipelines in a project"
          hints:
            readOnly: true
            idempotent: true
          call: "azure-devops-pipelines.list-pipelines"
          with:
            project: "tools.project"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-pipeline
          description: "Get a pipeline by ID"
          hints:
            readOnly: true
            idempotent: true
          call: "azure-devops-pipelines.get-pipeline"
          with:
            project: "tools.project"
            pipelineId: "tools.pipelineId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-pipeline
          description: "Create a new pipeline"
          hints:
            readOnly: false
          call: "azure-devops-pipelines.create-pipeline"
          with:
            project: "tools.project"
          outputParameters:
            - type: object
              mapping: "$."

        - name: run-pipeline
          description: "Trigger a pipeline run"
          hints:
            readOnly: false
          call: "azure-devops-pipelines.run-pipeline"
          with:
            project: "tools.project"
            pipelineId: "tools.pipelineId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-pipeline-runs
          description: "List runs for a pipeline"
          hints:
            readOnly: true
            idempotent: true
          call: "azure-devops-pipelines.list-pipeline-runs"
          with:
            project: "tools.project"
            pipelineId: "tools.pipelineId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-pipeline-run
          description: "Get details of a specific pipeline run"
          hints:
            readOnly: true
            idempotent: true
          call: "azure-devops-pipelines.get-pipeline-run"
          with:
            project: "tools.project"
            pipelineId: "tools.pipelineId"
            runId: "tools.runId"
          outputParameters:
            - type: object
              mapping: "$."
