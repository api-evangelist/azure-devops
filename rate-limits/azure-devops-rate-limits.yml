specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Azure DevOps
providerId: azure-devops
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - DevOps
  - CI/CD
  - Rate Limiting
description: Azure DevOps Services enforces a global consumption limit measured in Azure DevOps Throughput
  Units (TSTUs) - an abstract unit blending database (Azure SQL DTUs), compute, and storage cost. The
  limit is 200 TSTUs in any sliding five-minute window per user (or pipeline). Normal user activity generates
  fewer than 10 TSTUs per five minutes; bursts can reach 100. Throttled requests are first delayed (response
  still returns HTTP 200) and ultimately blocked with HTTP 429.
sources:
  - https://learn.microsoft.com/en-us/azure/devops/integrate/concepts/rate-limits
  - https://learn.microsoft.com/en-us/azure/devops/integrate/concepts/integration-bestpractices
headers:
  retryAfter: Retry-After
  resource: X-RateLimit-Resource
  delay: X-RateLimit-Delay
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  cost: X-RateLimit-Cost
responseCodes:
  throttled: 429
limits:
  - name: Per-user TSTU consumption
    scope: user
    metric: TSTU_per_5min
    limit: 200
    timeFrame: minute
    notes: Sliding 5-minute window. Delays start before block; block returns 429.
  - name: Per-pipeline TSTU consumption
    scope: pipeline
    metric: TSTU_per_5min
    limit: 200
    timeFrame: minute
    notes: Each pipeline tracked independently; matches user limit.
  - name: Typical user usage
    scope: user
    metric: TSTU_per_5min
    limit: 10
    timeFrame: minute
    notes: Reference baseline; not a hard cap.
  - name: Burst usage
    scope: user
    metric: TSTU_per_5min
    limit: 100
    timeFrame: minute
    notes: Reference burst threshold; sustained spikes above 200 are throttled.
policies:
  - name: Honor Retry-After
    description: When delays are imposed, response includes Retry-After. Wait before sending the next
      request. HTTP 200 is still returned during delay phase.
  - name: Backoff for 429
    description: When blocked (HTTP 429), apply exponential backoff. Retry-After indicates seconds to
      wait.
  - name: Monitor X-RateLimit headers
    description: Track X-RateLimit-Remaining and X-RateLimit-Limit to proactively slow down before delays
      begin.
  - name: Raise via Basic + Test Plans
    description: Identities used by tools/integrations can get higher rate limits by being assigned the
      Basic + Test Plans access level.
  - name: Per-namespace tracking
    description: Limits are tracked per shared resource; X-RateLimit-Resource indicates which threshold
      was reached.
  - name: Wiki, repo, work tracking limits
    description: Separate limits exist for Wiki files (25 MB), repo size, work items, queries, dashboards
      - see service-specific docs.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
