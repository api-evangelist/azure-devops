specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Azure DevOps
providerId: azure-devops
publisherName: Azure DevOps
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Azure
  - CI/CD
  - DevOps
  - Pipelines
  - Work Items
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Azure DevOps API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Azure DevOps
  ServiceCategory: Developer Tools / API
  ProviderName: Azure DevOps
  PublisherName: Azure DevOps
  InvoiceIssuerName: Azure DevOps
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Azure DevOps Work Item Tracking API
    baseURL: https://dev.azure.com/{organization}
    tags:
      - Azure
      - CI/CD
      - DevOps
      - Project Management
      - Work Items
    serviceName: Azure DevOps Work Item Tracking API
    serviceCategory: API
  - name: Azure DevOps Git Repositories API
    baseURL: https://dev.azure.com/{organization}
    tags:
      - Azure
      - CI/CD
      - DevOps
      - Git
      - Pull Requests
      - Version Control
    serviceName: Azure DevOps Git Repositories API
    serviceCategory: API
  - name: Azure DevOps Pipelines API
    baseURL: https://dev.azure.com/{organization}
    tags:
      - Azure
      - Build
      - CI/CD
      - DevOps
      - Pipelines
      - Release
    serviceName: Azure DevOps Pipelines API
    serviceCategory: API
  - name: Azure DevOps Artifacts API
    baseURL: https://pkgs.dev.azure.com/{organization}
    tags:
      - Artifacts
      - Azure
      - CI/CD
      - DevOps
      - Npm
      - NuGet
      - Package Management
    serviceName: Azure DevOps Artifacts API
    serviceCategory: API
  - name: Azure DevOps Test Plans API
    baseURL: https://dev.azure.com/{organization}
    tags:
      - Azure
      - CI/CD
      - DevOps
      - Test Plans
      - Testing
    serviceName: Azure DevOps Test Plans API
    serviceCategory: API
  - name: Azure DevOps Release API
    baseURL: https://vsrm.dev.azure.com/{organization}
    tags:
      - Azure
      - CI/CD
      - Deployment
      - DevOps
      - Release Management
    serviceName: Azure DevOps Release API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
