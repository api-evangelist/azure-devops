specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Azure DevOps
providerId: azure-devops
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - DevOps
  - CI/CD
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Azure DevOps Services: per-user-per-month subscription pricing
  for Basic and Basic + Test Plans, separate parallel-job pricing for CI/CD, and tiered storage pricing
  for Azure Artifacts. Billed via the Azure subscription tied to the organization.'
sources:
  - https://azure.microsoft.com/en-us/pricing/details/devops/azure-devops-services/
  - https://learn.microsoft.com/en-us/azure/devops/organizations/billing/buy-basic-access-add-users
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Microsoft Corporation
serviceCategory: Developer Tools
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Azure DevOps
  ServiceCategory: Developer Tools
  ProviderName: Microsoft
  PublisherName: Microsoft Corporation
  InvoiceIssuerName: Microsoft Corporation
  PricingCategory: Subscription
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: licensed_users
    description: Per-user-month for Basic and Basic + Test Plans access levels
    unit: seat
    aggregation: max
    dimensions:
      - access_level
      - organization
  - name: parallel_jobs_hosted
    description: Microsoft-hosted CI/CD parallel jobs above the free job
    unit: parallel_job
    aggregation: max
    dimensions:
      - organization
  - name: parallel_jobs_self_hosted
    description: Self-hosted CI/CD parallel jobs above the free job
    unit: parallel_job
    aggregation: max
    dimensions:
      - organization
  - name: artifacts_storage
    description: Azure Artifacts package feed storage above 2 GB free
    unit: GB-month
    aggregation: avg
    dimensions:
      - organization
      - tier
  - name: hosted_pipeline_minutes
    description: Build minute consumption on Microsoft-hosted agents
    unit: minute
    aggregation: sum
    dimensions:
      - pipeline
      - organization
principles:
  - name: Visibility
    description: Use Organization Settings -> Billing and Usage to see paid users, parallel jobs, Artifacts
      storage, and pipeline-minute consumption; export to Azure Cost Management.
  - name: Allocation
    description: Tag projects and pipelines; map organization billing to Azure subscription / cost center;
      use multi-organization billing to dedupe per-user costs across orgs.
  - name: Optimization
    description: Reclaim Stakeholder seats from inactive Basic users (sort by Last Access); auto-detect
      Visual Studio subscribers; consolidate Microsoft-hosted parallel jobs vs self-hosted based on workload
      mix.
  - name: Accountability
    description: Assign Project Collection Administrators as billing owners; review Artifacts storage
      growth and pipeline TSTU consumption monthly to avoid throttling.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
